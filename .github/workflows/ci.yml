name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7

  publish:
    name: Publish image to GHCR
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Derive image coordinates
        id: image
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "${version}" ]; then
            echo "::error::Could not derive an image version from tag '${GITHUB_REF_NAME}'."
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Jib receives the complete tag list, the version included. On the push path Jib
          # treats "jib.to.tags" as the authoritative set rather than as additions to the
          # tag in "jib.to.image", so naming the version here is what actually publishes it.
          # A final release also moves the floating "latest" tag; a pre-release such as
          # v1.2.0-rc1 publishes only its own version.
          case "${version}" in
            *-*) tags="${version}" ;;
            *)   tags="${version},latest" ;;
          esac
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${image} with tags: ${tags}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        run: >
          ./gradlew jib
          "-Djib.to.image=${{ steps.image.outputs.image }}:${{ steps.image.outputs.version }}"
          "-Djib.to.tags=${{ steps.image.outputs.tags }}"
          -Djib.console=plain

      - name: Summarize the published image
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            for tag in $(echo "${{ steps.image.outputs.tags }}" | tr ',' ' '); do
              echo "${{ steps.image.outputs.image }}:${tag}"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
