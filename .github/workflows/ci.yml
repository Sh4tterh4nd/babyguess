name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7

  publish:
    name: Publish image to GHCR
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Derive image coordinates
        id: image
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # Only a final release moves the floating "latest" tag. A pre-release such as
          # v1.2.0-rc1 re-states its own version so the build configuration's default
          # tag list ("0.1.0-SNAPSHOT", "latest") is always overridden.
          case "${version}" in
            *-*) echo "tags=${version}" >> "$GITHUB_OUTPUT" ;;
            *)   echo "tags=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        run: >
          ./gradlew jib
          "-Djib.to.image=${{ steps.image.outputs.image }}:${{ steps.image.outputs.version }}"
          "-Djib.to.tags=${{ steps.image.outputs.tags }}"
          -Djib.console=plain

      - name: Summarize the published image
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.image.outputs.image }}:${{ steps.image.outputs.version }}"
            echo "${{ steps.image.outputs.image }}:${{ steps.image.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
