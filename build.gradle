plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'com.google.cloud.tools.jib' version '3.5.4'
}

group = 'ch.babyguess'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    // H2 2.4.240 compiles CHECK constraints with the connection that created them.
    // Evaluating an IN constraint from another pooled connection can then fail with
    // "The database has been closed" (h2database/h2database#4291, #4342).
    // Keep the last unaffected release until H2 publishes a fixed version.
    runtimeOnly('com.h2database:h2') {
        version {
            strictly '2.3.232'
        }
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

jib {
    from {
        image = 'eclipse-temurin:21-jre'
    }
    to {
        image = providers.gradleProperty('image').getOrElse('ghcr.io/sh4tterh4nd/babyguess')
        tags = [version, 'latest']
    }
    extraDirectories {
        paths {
            path {
                from = file('src/main/jib')
                into = '/'
            }
        }
        permissions = ['/app/data': '777', '/app/data/branding': '777']
    }
    container {
        ports = ['8080']
        creationTime = 'USE_CURRENT_TIMESTAMP'
        user = '1000:1000'
        volumes = ['/app/data']
        workingDirectory = '/app'
        environment = [SPRING_PROFILES_ACTIVE: 'prod']
    }
}
