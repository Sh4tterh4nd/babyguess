name: ${COMPOSE_PROJECT_NAME:-babyguess-dev}

services:
  data-permissions:
    image: busybox:1.36.1
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /app/data"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - babyguess-data:/app/data

  babyguess:
    image: shatterhand/babyguess:${BABYGUESS_IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      data-permissions:
        condition: service_completed_successfully
    ports:
      - "${BABYGUESS_HOST_ADDRESS:-0.0.0.0}:${BABYGUESS_HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      BABYGUESS_PORT: "8080"
      BABYGUESS_DATABASE_URL: "jdbc:h2:file:/app/data/babyguess;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH"
      BABYGUESS_DATABASE_USERNAME: "${BABYGUESS_DATABASE_USERNAME:-sa}"
      BABYGUESS_DATABASE_PASSWORD: "${BABYGUESS_DATABASE_PASSWORD:-development-db-password}"
      BABYGUESS_ADMIN_USERNAME: "${BABYGUESS_ADMIN_USERNAME:-admin}"
      BABYGUESS_ADMIN_PASSWORD: "${BABYGUESS_ADMIN_PASSWORD:-admin12345678}"
      BABYGUESS_TOKEN_SECRET: "${BABYGUESS_TOKEN_SECRET:-development-only-token-secret-change-me}"
      BABYGUESS_PUBLIC_BASE_URL: "${BABYGUESS_PUBLIC_BASE_URL:-http://localhost:8080/}"
      BABYGUESS_SECRET_ENCRYPTION_KEY: "${BABYGUESS_SECRET_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}"
      BABYGUESS_BRANDING_DIRECTORY: /app/data/branding
      BABYGUESS_SECURE_COOKIES: "${BABYGUESS_SECURE_COOKIES:-false}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    volumes:
      - babyguess-data:/app/data

volumes:
  babyguess-data:
