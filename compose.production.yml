name: babyguess

services:
  babyguess:
    image: ghcr.io/sh4tterh4nd/babyguess:${BABYGUESS_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BABYGUESS_HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      BABYGUESS_PORT: "8080"
      BABYGUESS_DATABASE_URL: "jdbc:h2:file:/app/data/babyguess;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH"
      BABYGUESS_DATABASE_USERNAME: "${BABYGUESS_DATABASE_USERNAME:-sa}"
      BABYGUESS_DATABASE_PASSWORD: "${BABYGUESS_DATABASE_PASSWORD:?Set BABYGUESS_DATABASE_PASSWORD}"
      BABYGUESS_ADMIN_USERNAME: "${BABYGUESS_ADMIN_USERNAME:-admin}"
      BABYGUESS_ADMIN_PASSWORD: "${BABYGUESS_ADMIN_PASSWORD:?Set BABYGUESS_ADMIN_PASSWORD}"
      BABYGUESS_TOKEN_SECRET: "${BABYGUESS_TOKEN_SECRET:?Set BABYGUESS_TOKEN_SECRET}"
      BABYGUESS_PUBLIC_BASE_URL: "${BABYGUESS_PUBLIC_BASE_URL:?Set BABYGUESS_PUBLIC_BASE_URL}"
      BABYGUESS_SECRET_ENCRYPTION_KEY: "${BABYGUESS_SECRET_ENCRYPTION_KEY:?Set BABYGUESS_SECRET_ENCRYPTION_KEY}"
      BABYGUESS_BRANDING_DIRECTORY: /app/data/branding
      BABYGUESS_SECURE_COOKIES: "true"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    volumes:
      - babyguess-data:/app/data

volumes:
  babyguess-data:
    name: babyguess-data
